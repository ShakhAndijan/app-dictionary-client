# Activated with SPRING_PROFILES_ACTIVE=prod (set in docker-compose.prod.yml).
# No defaults for secrets: the app refuses to start if they are missing.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Never drop or recreate tables in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET}

# Swagger / OpenAPI are not exposed publicly.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Behind Caddy (reverse proxy): trust X-Forwarded-* headers.
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
