spring.application.name=dictionary

# ===== PostgreSQL datasource =====
# The database must already exist. Create it once with:  CREATE DATABASE dictionary;
# Override any of these with environment variables instead of editing the file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dictionary}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}

# ===== JPA / Hibernate =====
# 'update' lets Hibernate create/adjust the 'users' table automatically on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# CHANGE app.jwt.secret IN PRODUCTION. Must be Base64-encoded and decode to >= 256 bits (32 bytes).
# Generate a new one with:
#   PowerShell> $b=New-Object byte[] 48; [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b); [Convert]::ToBase64String($b)
app.jwt.secret=${JWT_SECRET:XOx00perpblMuNIUPDWvu4ZC3wuCmnCuB7rnYqalsLroCVYFsNS0CEfGot3Wlx8U}
# Access token lifetime in milliseconds (default 15 minutes).
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Refresh token lifetime in milliseconds (default 30 days). Refresh tokens are single-use and stored hashed.
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# ===== OpenAPI / Swagger UI =====
# Swagger UI at /swagger-ui.html, raw spec at /v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
