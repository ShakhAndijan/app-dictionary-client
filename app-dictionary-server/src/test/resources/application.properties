# Test configuration: in-memory H2 (PostgreSQL compatibility mode) so the Spring
# context loads and the auth flow can be exercised without a running PostgreSQL.
spring.application.name=dictionary

spring.datasource.url=jdbc:h2:mem:dictionarytest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

app.jwt.secret=XOx00perpblMuNIUPDWvu4ZC3wuCmnCuB7rnYqalsLroCVYFsNS0CEfGot3Wlx8U
app.jwt.expiration-ms=3600000

# Keep test output readable.
logging.level.root=WARN
app.jwt.refresh-expiration-ms=2592000000
